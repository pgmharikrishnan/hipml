[workspace]
resolver = "2"
members = [
    "crates/hipml-core",
    "crates/hipml-hip",
    "crates/hipml-kernels",
    "crates/hipml-model",
    "crates/hipml-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pgmharikrishnan/hipml"

[workspace.dependencies]
hipml-core = { path = "crates/hipml-core" }
hipml-hip = { path = "crates/hipml-hip" }
hipml-kernels = { path = "crates/hipml-kernels" }
hipml-model = { path = "crates/hipml-model" }

[profile.release]
lto = "thin"
codegen-units = 1
